# Runs both test suites on synthetic data. No participant data is in the repository.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no prebuilt Python 3.9, and 3.9 is what stock macOS ships,
    # so it stays in the matrix. Not a container: the tests check unreadable files, which root can read.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make test
